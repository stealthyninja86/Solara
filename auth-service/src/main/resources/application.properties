spring.application.name=auth-service

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0

server.port=4001

#postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=admin_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

#jwt
#15 mins
jwt.access-expiry=900000
#7 days
jwt.refresh-expiry=604800000
jwt.private-key=classpath:keys/private.pem
jwt.public-key=classpath:keys/public.pem

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# cookie
cookie.secure=${COOKIE_SECURE:true}
cookie.path=${COOKIE_PATH:/auth}