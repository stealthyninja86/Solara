spring.application.name=auth-service

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false

server.port=4001

#postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=admin_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#jwt
#15 mins
jwt.access-expiry=900000
#7 days
jwt.refresh-expiry=604800000
jwt.private-key=file:/app/keys/private.pem
jwt.public-key=file:/app/keys/public.pem
jwt.key-id=solara-key-1

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# cookie
cookie.secure=${COOKIE_SECURE:true}
cookie.path=${COOKIE_PATH:/}

# internal service-to-service access (shared secret, set via APP_INTERNAL_API_KEY in compose)
app.internal-api-key=${APP_INTERNAL_API_KEY:change-me-service-secret}

# LLM provider model-list endpoints
app.llm.ollama.base-url=${LLM_OLLAMA_BASE_URL:http://host.docker.internal:11434}
app.llm.ollama-cloud.models-url=${LLM_OLLAMA_CLOUD_MODELS_URL:https://ollama.com/v1/models}
app.llm.gemini.models-url=${LLM_GEMINI_MODELS_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.llm.openai.models-url=${LLM_OPENAI_MODELS_URL:https://api.openai.com/v1/models}