# Solara frontend — plain-HTTP nginx config (used until certs exist in
# /etc/nginx/certs; docker-entrypoint.sh swaps in ssl-mode.conf once they do).
# Proxies /api to the api-gateway over the compose network (service name, not
# a published host port) — same origin as the Vite dev proxy, so cookies
# (credentials: include) work unchanged.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # bulk CSV import endpoint
    client_max_body_size 25m;

    # Let's Encrypt HTTP-01 challenge (webroot shared with the host's certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # gateway: preserve the original URI (no trailing slash on proxy_pass)
    location /api/ {
        proxy_pass http://api-gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: react-router owns client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
