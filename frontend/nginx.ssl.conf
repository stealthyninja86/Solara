# Solara frontend — HTTPS nginx config, swapped in over default.conf by
# docker-entrypoint.sh when /etc/nginx/certs/fullchain.pem + privkey.pem exist
# (placed there by the certbot deploy hook on the host).
# Port 80 keeps serving the ACME challenge so renewals never need a port
# change; everything else redirects to 443.

# HTTP: ACME challenge + redirect
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the real site
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # bulk CSV import endpoint
    client_max_body_size 25m;

    # gateway: preserve the original URI (no trailing slash on proxy_pass)
    location /api/ {
        proxy_pass http://api-gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: react-router owns client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
