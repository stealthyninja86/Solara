apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: transaction-service
          image: 609394381484.dkr.ecr.us-east-1.amazonaws.com/solara/transaction-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://transaction-db:5432/db"
            - name: APP_CATEGORIZATION_SKIP_AI
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
          envFrom:
            - secretRef:
                name: solara-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4002
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4002
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 4002
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  labels:
    app: transaction-service
spec:
  type: NodePort
  selector:
    app: transaction-service
  ports:
    - port: 4002
      targetPort: 4002
      nodePort: 30402
