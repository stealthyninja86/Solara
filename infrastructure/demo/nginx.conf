# Solara demo — single-host reverse proxy (nginx on the EC2 host, not a container).
# Serves the built React SPA from frontend/dist and proxies /api to the
# api-gateway container (published on host port 4000) — same path the Vite dev
# proxy used, so cookies (credentials: include) work unchanged on one origin.
server {
    listen 80 default_server;
    server_name _;

    root /srv/solara/frontend/dist;
    index index.html;

    # bulk CSV import endpoint
    client_max_body_size 25m;

    # gateway: preserve the original URI (no trailing slash on proxy_pass)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: react-router owns client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
