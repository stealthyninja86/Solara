global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: solara-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:4000
          - auth-service:4001
          - transaction-service:4002
          - insight-service:4003
