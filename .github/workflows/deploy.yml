# .github/workflows/deploy.yml
# Solara CI/CD — PHASE 1 (verify first): build+test on every PR and push to main.
#
# This file only runs the build-test matrix for now. The AWS stages (build-image ->
# migrate -> deploy to ECR/ECS) are deferred until the AWS environment is provisioned
# (see cicd_tutorial.md Phase 1 + aws_deployment_tutorial.md) and are re-added then.
# PRs never touch AWS by construction: this file has zero AWS actions today.
name: Deploy Solara

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                   # one red service must not cancel the other three
      matrix:
        service:
          - api-gateway
          - auth-service
          - transaction-service
          - insight-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                 # ~/.m2 cache across runs — the #1 pipeline speedup
      - name: Compile + package
        working-directory: ${{ matrix.service }}
        # Tests are deferred (JUnit/Mockito/Testcontainers land later). The moment the test
        # suites land, flip to `./mvnw verify` and delete the skip flag.
        run: ./mvnw package -Dmaven.test.skip=true