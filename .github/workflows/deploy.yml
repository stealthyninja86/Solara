# .github/workflows/deploy.yml
# Solara CI/CD — Phase 1 (build-test) + Phase 2 (build-and-push to ECR).
#
# Phase 1: build+test on every PR and push to main/production.
# Phase 2: build Docker images and push to ECR (main only, after build-test passes).
#          Needs IAM role `github-solara-ecr` (OIDC, one-time root console setup — §6.3).
#
# This workflow lives on main and production; GitHub runs it only for branches it is pushed to.
name: Deploy Solara

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                   # one red service must not cancel the other three
      matrix:
        service:
          - api-gateway
          - auth-service
          - transaction-service
          - insight-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                 # ~/.m2 cache across runs — the #1 pipeline speedup
      - name: Compile + package
        working-directory: ${{ matrix.service }}
        # Tests are deferred (JUnit/Mockito/Testcontainers land later). The moment the test
        # suites land, flip to `./mvnw verify` and delete the skip flag.
        run: ./mvnw package -Dmaven.test.skip=true

  build-and-push:
    name: build-and-push (${{ matrix.service }})
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write                   # OIDC — lets GitHub assume the IAM role without a password
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - transaction-service
          - insight-service
          - frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::609394381484:role/github-solara-ecr
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2.1.7
      - name: Build and push
        env:
          REGISTRY: 609394381484.dkr.ecr.us-east-1.amazonaws.com
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/solara/${{ matrix.service }}:$TAG -t $REGISTRY/solara/${{ matrix.service }}:latest ./${{ matrix.service }}
          docker push $REGISTRY/solara/${{ matrix.service }}:$TAG
          docker push $REGISTRY/solara/${{ matrix.service }}:latest