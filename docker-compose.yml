services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: solara/api-gateway:latest
    container_name: api-gateway
    ports:
      - "4000:4000"
    environment:
      - SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT-TIMEOUT=2000
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  auth-service-db:
    image: postgres:latest
    container_name: auth-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5001:5432"
    volumes:
      - ./auth-service/auth-service-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  auth-service:
    image: solara/auth-service:latest
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "4001:4001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      COOKIE_SECURE: "false"
      COOKIE_PATH: "/api/v1/auth"
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      auth-service-db:
          condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  transaction-service-db:
    image: postgres:16-alpine
    container_name: transaction-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5002:5432"
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    image: solara/transaction-service:latest
    container_name: transaction-service
    ports:
      - "4002:4002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_UPLOAD_DIRECTORY: /app/data/uploads
      SPRING_SERVLET_MULTIPART_LOCATION: /app/data/uploads/tmp
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      transaction-service-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - internal

  insight-service-db:
    image: pgvector/pgvector:pg16
    container_name: insight-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5003:5432"
    volumes:
      - insight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  insight-service:
    build:
      context: ./insight-service
      dockerfile: Dockerfile
    image: solara/insight-service:latest
    container_name: insight-service
    ports:
      - "4003:4003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://insight-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_CATEGORIZATION_SKIP_AI: "false"
    depends_on:
      insight-service-db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - internal

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: solara-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  transaction-db-data:
  insight-db-data:
  kafka-data:
  ollama-data: