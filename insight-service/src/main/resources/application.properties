spring.application.name=insight-service

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false

server.port=4003

spring.datasource.url=jdbc:postgresql://localhost:5003/db
spring.datasource.username=admin_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed/merchant_knowledge_base_seed.sql
spring.sql.init.continue-on-error=false

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=insight-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-interval-ms=300000
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.retry.topic.enabled=true
spring.kafka.retry.topic.attempts=3
spring.kafka.retry.topic.backoff-multiplier=2.0
spring.kafka.retry.topic.backoff-initial-interval=1000

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.threads.virtual.enabled=true

# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.model=gpt-4o
# spring.ai.openai.embedding.model=text-embedding-3-small

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.model=qwen3.5:4b
spring.ai.ollama.embedding.model=nomic-embed-text

resilience4j.circuitbreaker.instances.llmAgent.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmAgent.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.llmAgent.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmAgent.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llmAgent.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.llmAgent.timeout-duration=30s
resilience4j.retry.instances.llmAgent.max-attempts=3
resilience4j.retry.instances.llmAgent.wait-duration=500ms

resilience4j.circuitbreaker.instances.insight-generator.sliding-window-size=10
resilience4j.circuitbreaker.instances.insight-generator.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.insight-generator.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.insight-generator.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.insight-generator.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.insight-generator.timeout-duration=90s
resilience4j.retry.instances.insight-generator.max-attempts=2
resilience4j.retry.instances.insight-generator.wait-duration=500ms

app.cache.agent-ttl-seconds=86400
app.ai.enabled=true
app.categorization.skip-ai=false
app.categorization.batch-size=10
app.regeneration.limit-per-day=50

# settings read from auth-service (synchronous REST, service-to-service, uncached)
app.settings.base-url=${APP_SETTINGS_BASE_URL:http://localhost:4001}
app.settings.api-key=${APP_SETTINGS_API_KEY:change-me-service-secret}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.rag.limit=5
app.rag.min-similarity=0.60
app.rag.min-history=30

app.merchant-profile.sync-enabled=true
app.merchant-profile.sync-interval-ms=21600000
app.merchant-profile.sync-initial-delay-ms=60000

