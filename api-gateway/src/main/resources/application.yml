
spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:4001/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true

          routes:
            - id: auth-service
              uri: http://auth-service:4001
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: authServiceCB
                    fallbackUri: forward:/fallback/auth

            - id: transaction-service
              uri: http://transaction-service:4002
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: transactionServiceCB
                    fallbackUri: forward:/fallback/transactions

            - id: insight-service-category
              uri: http://insight-service:4003
              predicates:
                - Path=/api/v1/category/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: insightServiceCB
                    fallbackUri: forward:/fallback/insight
              metadata:
                response-timeout: 120000

            - id: insight-service-insights
              uri: http://insight-service:4003
              predicates:
                - Path=/api/v1/insights/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: insightServiceCB
                    fallbackUri: forward:/fallback/insight
              metadata:
                response-timeout: 120000

          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://solara-demo.ddns.net:30300"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
            pool:
              type: elastic
              max-connections: 500
              max-idle-time: 60s
              max-life-time: 300s
              acquire-timeout: 3000

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms

  lifecycle:
    timeout-per-shutdown-phase: 30s

resilience4j:
  circuitbreaker:
    instances:
      authServiceCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10

      transactionServiceCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10

      insightServiceCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10

  # The Spring Cloud Gateway CircuitBreaker filter wraps every call in a
  # TimeLimiter. Its default timeout is 1s (io.github.resilience4j TimeLimiterConfig#ofDefaults),
  # which silently overrides the routes' intended response-timeout metadata and kills
  # any slower call (LLM insight generation, cold-started aggregation queries) as a
  # failure, tripping the breaker. Per-instance timeouts trade structured below:
  # fast services (auth/transaction) keep tight limits so their breakers trip
  # promptly on genuine hangs; insight gets a long window for LLM + heavy reads.
  timelimiter:
    instances:
      authServiceCB:
        timeout-duration: 5s
        cancel-running-future: true
      transactionServiceCB:
        timeout-duration: 15s
        cancel-running-future: true
      insightServiceCB:
        timeout-duration: 60s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0

server:
  port: 4000
  shutdown: graceful
